name: ci

# RR-09: least privilege - this workflow only reads the repo and runs checks.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ["24.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Build first: cli-smoke tests execute the built dist/cli/cli.js artifact.
      - run: npm run build
      - run: npm test

  # RR-08: deterministic hermetic browser lane (ubuntu-only: cost decision).
  # No secrets, no model credentials, no external side effects — the lane
  # spawns its own mock-model server. Artifacts upload only on failure.
  browser:
    name: browser e2e (ubuntu) / node 24.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        timeout-minutes: 15
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 7
